name: pymutate-gate

on:
  push:
    branches: [main]
    paths:
      - 'projects/pymutate-enterprise/**'
      - '.github/workflows/pymutate-gate.yml'
  pull_request:
    paths:
      - 'projects/pymutate-enterprise/**'
      - '.github/workflows/pymutate-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  self-test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: projects/pymutate-enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/pymutate-enterprise/pyproject.toml

      - name: Install pymutate
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Self-test suite (must be 100% green)
        run: pytest tests/ -q

      - name: Mutation gate on demo_sut (weak tests must be caught, exit 1)
        run: |
          set +e
          python -m pymutate.cli run \
            --html mutation-report.html \
            --sarif mutation-results.sarif
          code=$?
          set -e
          echo "pymutate exit code: $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::Expected pymutate to fail the gate (exit 1) on the intentionally weak demo_tests, got $code"
            exit 1
          fi
          echo "Gate correctly rejected the weak demo test suite."

      - name: Re-root SARIF paths at the repository root
        if: always() && hashFiles('projects/pymutate-enterprise/mutation-results.sarif') != ''
        run: |
          python - <<'EOF'
          import json, pathlib
          path = pathlib.Path("mutation-results.sarif")
          sarif = json.loads(path.read_text())
          def walk(node):
              if isinstance(node, dict):
                  location = node.get("artifactLocation")
                  if isinstance(location, dict) and "uri" in location:
                      location["uri"] = "projects/pymutate-enterprise/" + location["uri"]
                      location.pop("uriBaseId", None)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(sarif)
          for run in sarif["runs"]:
              run.pop("originalUriBaseIds", None)
          path.write_text(json.dumps(sarif, indent=2))
          EOF

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pymutate-reports-py${{ matrix.python-version }}
          path: |
            projects/pymutate-enterprise/mutation-report.html
            projects/pymutate-enterprise/mutation-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Publish SARIF to code scanning
        if: always() && matrix.python-version == '3.11' && hashFiles('projects/pymutate-enterprise/mutation-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: projects/pymutate-enterprise/mutation-results.sarif
          category: pymutate
