# Week 4 — run personal API smoke outside the laptop
name: smoke

on:
  push:
    branches: [main]
    paths:
      - 'smoke/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'smoke/**'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smoke/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            smoke/playwright-report/
            smoke/test-results/
          retention-days: 7
