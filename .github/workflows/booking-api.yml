name: booking-api

on:
  push:
    branches: [main]
    paths:
      - "projects/booking-api-automation/**"
      - ".github/workflows/booking-api.yml"
  pull_request:
    paths:
      - "projects/booking-api-automation/**"
      - ".github/workflows/booking-api.yml"
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: projects/booking-api-automation
    steps:
      - uses: actions/checkout@v7

      - name: Show container environment
        run: |
          head -2 /etc/os-release
          node --version
          echo "uid=$(id -u)"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright --version

      - name: Run API tests
        run: npx playwright test --workers=2

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: booking-api-report
          path: |
            projects/booking-api-automation/playwright-report/
            projects/booking-api-automation/test-results/
          retention-days: 7
