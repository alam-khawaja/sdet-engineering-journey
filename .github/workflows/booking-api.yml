name: booking-api

on:
  push:
    branches: [main]
    paths:
      - 'projects/booking-api-automation/**'
      - '.github/workflows/booking-api.yml'
  pull_request:
    paths:
      - 'projects/booking-api-automation/**'
      - '.github/workflows/booking-api.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/booking-api-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/booking-api-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --workers=2

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-api-report
          path: |
            projects/booking-api-automation/playwright-report/
            projects/booking-api-automation/test-results/
          retention-days: 7
