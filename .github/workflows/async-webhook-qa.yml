name: async-webhook-qa

on:
  push:
    branches: [main]
    paths:
      - 'projects/async-webhook-state-machine-qa/**'
      - '.github/workflows/async-webhook-qa.yml'
  pull_request:
    paths:
      - 'projects/async-webhook-state-machine-qa/**'
      - '.github/workflows/async-webhook-qa.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: projects/async-webhook-state-machine-qa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/async-webhook-state-machine-qa/pyproject.toml

      - name: Install SUT and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: pytest --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: async-webhook-qa-report-py${{ matrix.python-version }}
          path: projects/async-webhook-state-machine-qa/report.html
          retention-days: 14
