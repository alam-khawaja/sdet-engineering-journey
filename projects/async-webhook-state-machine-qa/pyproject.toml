[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-webhook-state-machine-qa"
version = "1.0.0"
description = "Portfolio QA harness: async order state machine, optimistic locking, idempotency, DB-backed DLQ, and signed webhooks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-html>=4.1",
]

[tool.setuptools.packages.find]
include = ["sut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "local_only: needs direct access to the SUT database (skipped when BASE_URL is set)",
]
